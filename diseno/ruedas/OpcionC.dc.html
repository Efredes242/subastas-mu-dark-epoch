<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #14110d; }
    * { box-sizing: border-box; }
    a { color: #e0b871; }
    a:hover { color: #f1e9db; }
  </style>
</helmet>

<div style="width:460px;height:640px;display:flex;flex-direction:column;overflow:hidden;background:#14110d;color:#f1e9db;font-family:'Manrope','Segoe UI',system-ui,sans-serif;padding:18px">

  <div style="flex-shrink:0;display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:14px">
    <div style="font-size:17px;font-weight:800;letter-spacing:-0.02em;color:#79c895">C · La rueda entera</div>
    <div style="font-size:11px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#7c7163">Opción</div>
  </div>

  <div style="flex:1;min-height:0;background:#231d16;border:1px solid #2e2720;border-radius:13px;display:flex;flex-direction:column;overflow:hidden">

    <div style="flex-shrink:0;display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 13px 10px">
      <div style="font-size:13px;font-weight:800;letter-spacing:-0.01em">Items del Kundun</div>
      <div style="font-size:10px;font-weight:700;color:#7c7163">3 en la rueda</div>
    </div>

    <!-- Toda la vuelta, con el drop que le tocó a cada uno al costado -->
    <div style="flex:1;min-height:0;padding:0 7px 10px;display:flex;flex-direction:column;gap:4px">
      <sc-for list="{{vuelta}}" as="v" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:11px;background:{{v.bg}};box-shadow:{{v.barra}}">
          <div style="width:22px;height:22px;flex-shrink:0;border-radius:7px;background:{{v.numBg}};color:{{v.numFg}};display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800">{{v.turno}}</div>

          <div style="flex:1;min-width:0">
            <div style="font-size:13.5px;font-weight:{{v.peso}};color:{{v.fg}};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{v.nombre}}</div>
            <div style="font-size:11px;font-weight:700;color:{{v.notaFg}};margin-top:2px">{{v.nota}}</div>
          </div>

          <sc-if value="{{v.tieneDrop}}" hint-placeholder-val="{{ true }}">
            <div style="width:30px;height:30px;flex-shrink:0;border-radius:9px;background:{{v.dropBg}};border:1px solid {{v.dropLn}};display:flex;align-items:center;justify-content:center">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{v.dropFg}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8 20.5 9l-3.2 10.2H6.7L3.5 9 12 2.8Z"/></svg>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex-shrink:0;padding-top:14px;display:flex;flex-direction:column;gap:6px">
    <div style="font-size:12.5px;line-height:1.45;color:#a99d89"><span style="color:#79c895;font-weight:800">A favor:</span> se ve la vuelta completa: quién ya cobró, a quién le toca y quién viene. El cuadro de la derecha sobra.</div>
    <div style="font-size:12.5px;line-height:1.45;color:#7c7163"><span style="color:#e08d7c;font-weight:800">En contra:</span> mezcla dos cosas en una lista. Con 15 personas por rueda se hace larga.</div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":460,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      vuelta: [
        {
          turno: '1', nombre: 'DenaliMyrella', nota: 'le toca el próximo',
          bg: '#132119', barra: 'inset 3px 0 0 #79c895', numBg: '#79c895', numFg: '#132119',
          fg: '#f1e9db', peso: '800', notaFg: '#79c895', tieneDrop: false,
          dropBg: '#231d16', dropLn: '#2e2720', dropFg: '#7c7163'
        },
        {
          turno: '2', nombre: 'UriahDelyricth', nota: 'Pluma de Condor (1 de 2)',
          bg: '#2a2015', barra: 'inset 3px 0 0 #e0b871', numBg: '#e0b871', numFg: '#1a1409',
          fg: '#f1e9db', peso: '700', notaFg: '#e0b871', tieneDrop: true,
          dropBg: '#16240f', dropLn: '#33522a', dropFg: '#8fc97c'
        },
        {
          turno: '3', nombre: 'Alckron', nota: 'Cristal del Caos',
          bg: '#2a2015', barra: 'inset 3px 0 0 #e0b871', numBg: '#e0b871', numFg: '#1a1409',
          fg: '#f1e9db', peso: '700', notaFg: '#e0b871', tieneDrop: true,
          dropBg: '#2a2015', dropLn: '#5b4826', dropFg: '#e0b871'
        }
      ]
    };
  }
}
</script>
</body>
</html>
